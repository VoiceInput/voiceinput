name: Bug report
description: Report a reproducible problem with VoiceInput
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: input
    id: version
    attributes:
      label: VoiceInput version
      description: Include the versions of every @voiceinput package in use.
      placeholder: "@voiceinput/react 0.1.0, @voiceinput/openai 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - OpenAI
        - ElevenLabs
        - Deepgram
        - Custom provider
        - Simulated provider
        - Not provider-specific
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 140 on macOS 26"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework
      description: Include the framework and version used by the application.
      placeholder: "Next.js 16.1.6 with React 19.2.4"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description:
        Link to a minimal reproduction or provide the smallest code sample and
        steps that reproduce the problem.
      placeholder: |
        1. Open ...
        2. Start dictation ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description:
        What happened instead? Include relevant logs with credentials and
        transcripts removed.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
        - label:
            I removed provider keys, issued credentials, recordings, and
            transcripts from this report.
          required: true
