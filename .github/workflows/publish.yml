name: Publish packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH after completing the release checklist
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  provider-smoke:
    name: Verify live provider credentials
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-smoke
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:provider-smoke

  publish:
    name: Publish fixed package suite
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    needs: provider-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:browser
      - run: pnpm validate:packages
      - run: pnpm test:e2e
      - run: pnpm test:security
      - name: Publish through npm trusted publishing
        run: pnpm release
