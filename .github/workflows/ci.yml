name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    name: Clean-room release checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: voiceinput-security-openai-canary
      ELEVENLABS_API_KEY: voiceinput-security-elevenlabs-canary
      DEEPGRAM_API_KEY: voiceinput-security-deepgram-canary
      BROWSERSTACK_ACCESS_KEY: voiceinput-security-browserstack-canary
      VOICEINPUT_DEV_AUTH_SECRET: voiceinput-security-auth-canary
    steps:
      - uses: actions/checkout@v6
      - name: Verify artifact-free checkout
        shell: bash
        run: |
          generated="$(find packages apps -type d \( -name dist -o -name .next -o -name .turbo \) -print -quit)"
          tarball="$(find packages -type f -name '*.tgz' -print -quit)"
          if [[ -n "$generated" || -n "$tarball" || -d .turbo ]]; then
            echo "Generated artifacts were present before validation."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm validate:packages
      - run: pnpm test:e2e
      - if: always()
        run: pnpm test:security
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playground-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
