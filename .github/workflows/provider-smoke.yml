name: Provider credential smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Protocol and live Chromium provider checks
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-smoke
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Stream deterministic PCM through provider protocols
        id: protocol
        continue-on-error: true
        run: pnpm test:provider-smoke-suite
      - name: Run live browser sessions serially
        id: browser
        continue-on-error: true
        run: pnpm test:voice-live
      - name: Upload sanitized provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-smoke-${{ github.sha }}
          path: |
            provider-smoke-results/report.json
            voice-live-results/report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Enforce provider results
        if: always()
        env:
          PROTOCOL_OUTCOME: ${{ steps.protocol.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          if [[ "$PROTOCOL_OUTCOME" != "success" || "$BROWSER_OUTCOME" != "success" ]]; then
            echo "One or more provider checks failed; inspect the sanitized provider artifact."
            exit 1
          fi
