name: Browser compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "35 8 * * 1"

permissions:
  contents: read

concurrency:
  group: browserstack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Current and previous browsers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify BrowserStack credentials
        run: |
          test -n "$BROWSERSTACK_USERNAME"
          test -n "$BROWSERSTACK_ACCESS_KEY"
      - run: pnpm build
      - name: Run Chromium and real-device matrix
        run: pnpm exec browserstack-node-sdk playwright test
      - name: Upload Chromium and real-device evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browserstack-playwright-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
      - name: Run branded Safari and Firefox matrix
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test --config playwright.safari.config.ts
      - name: Upload branded desktop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browserstack-branded-desktop-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: pnpm test:security
